<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="dom">
    <h1>DOM</h1>
  </div>

  <div id="txt"></div>
  <input type="text" placeholder="Enter City" id="cityName">
  <select name="" id="city">
    <option value="">Select any city</option>
  </select>
  <input type="button" value="Click" id="btn" onclick="addCity();">
  <script>
    function addCity(){
      let cityName =document.getElementById('cityName').value;
      // console.log(cityName);
      let city = document.getElementById('city');
      let option = document.createElement('option');
      option.text = cityName;
      option.value = cityName;
      city.appendChild(option);
    }
    // document.getElementById('dom').style.color = 'blue';
    // document.getElementById('dom').style.backgroundColor = 'yellow';
    // document.getElementById('txt').innerHTML = 'hello css';


    // console.log(city);

  </script>

</body>n
</html>
